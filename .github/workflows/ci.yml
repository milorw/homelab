name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # gitleaks needs full history to scan properly

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-lint.txt

      - name: Install lint tools
        run: pip install -r .github/requirements-lint.txt

      - name: Install collections
        run: ansible-galaxy collection install -r .github/requirements.yml

      - name: yamllint
        run: "yamllint ansible/inventory ansible/playbooks"

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint playbooks/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: tflint
        working-directory: terraform
        run: tflint
