# Cloudflare API tokens, pulled from vault
cf_api_token_milorw: "{{ vault_cf_api_token_milorw }}"
cf_api_token_owennwb: "{{ vault_cf_api_token_owennwb }}"

# env var name (as referenced by the Caddyfile's {env.NAME}) -> token value
edge_cf_tokens:
  CF_API_TOKEN_MILORW: "{{ cf_api_token_milorw }}"
  CF_API_TOKEN_OWENNWB: "{{ cf_api_token_owennwb }}"

# Backend addresses resolved live from inventory, so no IP managed by this
# repo is duplicated here.
docker_apps_ip: "{{ hostvars[groups['docker_apps'][0]].ansible_host }}"
jellyfin_ip: "{{ hostvars[groups['jellyfin'][0]].ansible_host }}"
minecraft_ip: "{{ hostvars[groups['minecraft'][0]].ansible_host }}"
proxmox_ip: "{{ hostvars[groups['proxmox_nodes'][0]].ansible_host }}"

# Error-page behaviour. Every HTTP service gets a static page rendered onto
# the edge router itself, so it's still servable when the backend host is
# down - see docs/Ansible/edge-router.md.
#
# dial_timeout has to be short for that page to be any use: a powered-off
# backend drops SYNs rather than refusing them, so without it the browser
# hangs on the OS TCP timeout instead of showing anything.
edge_dial_timeout: 5s
# The error page retries the original URL this many times, this far apart...
edge_error_retry_delay: 8
edge_error_max_attempts: 5
# ...then hands off to the homepage after this many seconds, rather than
# sitting on a dead page. Only applies where there's somewhere to go: on
# the homepage's own hostname the page just stops retrying.
edge_error_handoff_delay: 5
# Which service in edge_services the error page links to as an escape hatch.
edge_homepage_service: homepage

edge_domains:
  milorw.me:
    cf_env_name: CF_API_TOKEN_MILORW
    services:
      - homebox
      - sure
      - proxmox
      - jellyfin
      - ombi
      - ha
      - minecraft
      - mcpanel
      - mealie
      - homepage

  owennwb.com:
    cf_env_name: CF_API_TOKEN_OWENNWB
    services:
      - homebox
      - sure
      - jellyfin
      - ombi
      - ha
      - minecraft
      - mealie
      - homepage

edge_services:
  homebox:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ docker_apps_ip }}"
        port: "{{ service_ports.homebox }}"

  sure:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ docker_apps_ip }}"
        port: "{{ service_ports.sure }}"

  # Proxmox's web UI is HTTPS-only with a self-signed cert, so the backend
  # connection needs TLS with verification skipped, not plain HTTP.
  proxmox:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ proxmox_ip }}"
        port: 8006
        transport_http: [tls_insecure_skip_verify]

  jellyfin:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ jellyfin_ip }}"
        port: "{{ service_ports.jellyfin }}"

  ombi:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ docker_apps_ip }}"
        port: "{{ service_ports.ombi }}"

  mealie:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ docker_apps_ip }}"
        port: "{{ service_ports.mealie }}"

  homepage:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ docker_apps_ip }}"
        port: "{{ service_ports.homepage }}"

  # Literal: Home Assistant is a separate appliance, not a guest this
  # repo manages.
  ha:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: 192.168.68.2
        port: 8123

  mcpanel:
    encodings: [gzip, zstd]
    reverse_proxy:
      - address: "{{ minecraft_ip }}"
        port: "{{ service_ports.crafty }}"
        transport_http: [tls_insecure_skip_verify]
        headers:
          Host: host

# Raw-TCP services, forwarded by HAProxy rather than Caddy's HTTP-only
# reverse_proxy. Still get a CoreDNS hostname so minecraft.domainname
# resolves, just not an HTTP route through Caddy.
edge_tcp_services:
  minecraft:
    listen_port: "{{ service_ports.minecraft }}"
    backend_port: "{{ service_ports.minecraft }}"
    address: "{{ minecraft_ip }}"

# --- Tailscale subnet router ---
#
# The edge routes the LAN for the tailnet. This is what gives remote access
# to things the reverse proxy can't carry - SMB on samba, and SSH to the
# LXCs, none of which are tailnet members themselves.
#
# One /32 per LXC rather than the whole LAN. Resolved from inventory for
# the same reason the backend addresses above are - a new container should
# not need its IP written down here a second time.
#
# Narrow on purpose:
#   - The only things that genuinely need this are SMB on samba and SSH to
#     the containers. Every HTTP service goes through Caddy, and minecraft's
#     game port through HAProxy, both on the edge's own tailnet address.
#   - It deliberately excludes the Proxmox host (.90). The host is a tailnet
#     member in its own right, so routing its LAN address through here makes
#     the return path asymmetric. Left out, that address stays on the LAN
#     where it works, and the host's own 100.x address remains the break-glass path.
#
# NOTE: changing this set means the new routes start out UNAPPROVED. They
# carry no traffic until approved in the tailnet admin console.
edge_tailscale_advertise_routes: >-
  {{ groups['proxmox_all_lxc']
     | map('extract', hostvars, 'ansible_host')
     | map('regex_replace', '$', '/32')
     | list | sort }}

# false = preserve the original 100.x source address instead of rewriting it
# to the edge's own LAN address.
#
# This is what lets the firewall distinguish a tailnet user from the reverse
# proxy: with SNAT on, every remote packet arrives looking like edge_router,
# so ts_net rules never match and lan_net rules match things that are not on
# the LAN at all.
#
# REQUIRES a return route for 100.64.0.0/10 via this container, or guests
# reply to an address their default gateway cannot reach.
edge_tailscale_snat_subnet_routes: false
