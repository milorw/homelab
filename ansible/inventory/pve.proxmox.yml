plugin: community.proxmox.proxmox
url: https://192.168.68.90:8006
user: ansible@pam
token_id: ansible

token_secret: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          37383465393530383964333737663965336430613330376361383435326138373533653031316462
          6239623330666232633736363235653731613663653234610a356334393737323162633439333261
          66303134623837623430623939626233366564336536323935333662333537376435646566323136
          3233343763323932320a656662356566633933373834383032353639656231303233646532346133
          32643965353234336337666431323966376636613663356666646434373662313532336362613463
          3664613434353563356439383534346562333664343365396263

validate_certs: false
exclude_nodes: true

want_facts: true

# Only guests Terraform owns
filters:
  - "'terraform' in (proxmox_tags_parsed | default([]))"

keyed_groups:
  # role_samba -> group "samba"
  - key: proxmox_tags_parsed | select('match', '^role_') | map('regex_replace', '^role_', '') | list
    prefix: ""
    separator: ""

  # every tag verbatim -> tag_terraform, tag_lxc, tag_role_samba
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"

  # lxc / qemu split
  - key: proxmox_vmtype
    prefix: type

compose:
  ansible_host: proxmox_net0.ip | ansible.utils.ipaddr('address')

strict: false
