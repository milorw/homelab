# Vars for the docker_apps group.

apps_root: /opt/apps

# --- sure ---
sure_postgres_user: sure_user
sure_postgres_db: sure_production
sure_ai_model: "gpt-5-mini-2025-08-07"
sure_ai_uri_base: "https://api.openai.com/v1/"

# --- mealie ---
mealie_base_url: "https://mealie.milorw.me"

# --- homepage ---
homepage_title: Shonk Shack Services
# Which domain the service links use. Only services on every domain are
# listed, so either works.
homepage_link_domain: milorw.me
# Dashboard groups, in the order they should appear.
homepage_groups:
  - Home
  - Media
  - Games
  - Services
# Generated from the service catalog's `homepage` blocks (all/services.yml).
homepage_service_meta: >-
  {%- set ns = namespace(out={}) -%}
  {%- for name, svc in services.items() if svc.homepage is defined -%}
  {%-   set ns.out = ns.out | combine({svc.subdomain | default(name): svc.homepage}) -%}
  {%- endfor -%}
  {{ ns.out }}
# A service listed here is rendered as a widget instead of a plain link.
# Widgets needing an API key should read it from a vault-backed var.
homepage_widgets:
  minecraft:
    type: minecraft
    url: "udp://{{ hostvars[groups['minecraft'][0]].ansible_host }}:{{ service_ports.minecraft }}"
  ombi:
    type: ombi
    # Straight to the container on this LXC, so the widget doesn't depend
    # on the edge router or public DNS being reachable.
    url: "http://{{ ansible_host }}:{{ service_ports.ombi }}"
    key: "{{ ombi_api_key }}"
# Bookmarks shown under the services. Empty by default, which also stops
# homepage writing its own bookmarks.yaml full of example links.
homepage_bookmarks: []
# Generated from the service catalog's `container` fields.
homepage_docker_containers: >-
  {%- set ns = namespace(out={}) -%}
  {%- for name, svc in services.items() if svc.container is defined -%}
  {%-   set ns.out = ns.out | combine({svc.subdomain | default(name): svc.container}) -%}
  {%- endfor -%}
  {{ ns.out }}

# Secrets, pulled from vault.
homebox_api_key_pepper: "{{ vault_homebox_api_key_pepper }}"
sure_postgres_password: "{{ vault_sure_postgres_password }}"
sure_secret_key_base: "{{ vault_sure_secret_key_base }}"
sure_ai_access_token: "{{ vault_sure_ai_access_token }}"
ombi_api_key: "{{ vault_ombi_api_key }}"
