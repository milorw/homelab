- name: Configure jellyfin LXC
  hosts: jellyfin
  gather_facts: true
  become: true

  tasks:

    # --- Identity ---
    #
    # This runs BEFORE the package is installed, deliberately. Jellyfin's
    # postinst creates its own user if one doesn't exist, and Debian would
    # allocate whatever system uid happens to be free - leaving the service
    # not owning its own library on /tank. Creating the account first with
    # pinned ids means the package adopts it.
    #
    # The container is privileged with no idmap, so these ids are the same
    # numbers on the Proxmox host. They have to match what already owns
    # /tank/appdata/jellyfin_data and /tank/jellyfin.

    - name: Create the jellyfin group
      ansible.builtin.group:
        name: jellyfin
        gid: "{{ jellyfin_gid }}"
        system: true
        state: present

    # video/render carry the GPU device nodes - terraform pins the same
    # gids on the passed-through devices. jellyfin_srv owns the media and
    # is shared with samba, which force-creates files into it.
    # A gid held by some *other* group makes `group:` fail with a bare
    # "groupmod: GID 'N' already exists", which says nothing about which
    # group is in the way.
    - name: Read existing groups
      ansible.builtin.getent:
        database: group

    - name: Fail clearly if a required gid belongs to another group
      ansible.builtin.assert:
        that:
          - holder | length == 0 or holder[0] == item.name
        fail_msg: >-
          gid {{ item.gid }} is wanted for '{{ item.name }}' but already
          belongs to '{{ holder | first | default('?') }}'. Pick a free gid in
          group_vars/jellyfin.yml and set the matching device_passthrough gid
          in terraform/lxc-jellyfin.tf, rather than renumbering a system group.
        quiet: true
      vars:
        holder: >-
          {{ ansible_facts.getent_group | dict2items
             | selectattr('value.1', 'eq', item.gid | string)
             | map(attribute='key') | list }}
      loop: "{{ jellyfin_groups }}"
      loop_control:
        label: "{{ item.name }} ({{ item.gid }})"

    - name: Create the groups jellyfin needs access through
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        system: true
        state: present
      loop: "{{ jellyfin_groups }}"
      loop_control:
        label: "{{ item.name }} ({{ item.gid }})"

    - name: Create the jellyfin service account
      ansible.builtin.user:
        name: jellyfin
        uid: "{{ jellyfin_uid }}"
        group: jellyfin
        groups: "{{ jellyfin_groups | map(attribute='name') | list }}"
        append: false
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/jellyfin
        create_home: false
        state: present

    # --- Package ---

    - name: Install prerequisites for the jellyfin repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: "{{ jellyfin_repo_keyring | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Fetch the jellyfin signing key
      ansible.builtin.get_url:
        url: "{{ jellyfin_repo_key_url }}"
        dest: "{{ jellyfin_repo_keyring }}"
        owner: root
        group: root
        mode: "0644"

    # The suite tracks the container's own release, so this doesn't need
    # editing when the base image moves. Jellyfin publishes for trixie.
    - name: Add the jellyfin repository
      ansible.builtin.deb822_repository:
        name: jellyfin
        types: deb
        uris: "{{ jellyfin_repo_url }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        architectures: amd64
        signed_by: "{{ jellyfin_repo_keyring }}"
        state: present
      register: jellyfin_repo

    - name: Install jellyfin
      ansible.builtin.apt:
        name: jellyfin
        state: present
        update_cache: "{{ jellyfin_repo.changed }}"

    # --- Storage ---
    #
    # These live on the /tank/appdata mount. The playbook does not create
    # or touch their contents: the library database, metadata and user
    # accounts inside are state, in the same way /tank/appdata/*_data is
    # for every other service here.

    # These paths exist either way - the package creates them - so checking
    # they exist proves nothing. What matters is whether they're the bind
    # mounts from /tank/appdata or empty directories on the container's own
    # disk, which is the difference between the library being on the pool
    # and being quietly rebuilt from scratch on the rootfs.
    - name: Check the appdata bind mounts are in place
      ansible.builtin.command:
        argv: [findmnt, --noheadings, --output, SOURCE, --target, "{{ item }}"]
      register: jellyfin_mounts
      changed_when: false
      failed_when: false
      # Read-only, so it runs under --check too - later tasks need its output.
      check_mode: false
      loop:
        - "{{ jellyfin_data_dir }}"
        - "{{ jellyfin_config_dir }}"

    - name: Fail if the appdata bind mounts are missing
      ansible.builtin.assert:
        that:
          - "'appdata' in item.stdout"
        fail_msg: >-
          {{ item.item }} is not backed by /tank/appdata (findmnt reports
          '{{ item.stdout | trim | default('nothing', true) }}'). It should be a
          mount_point in terraform/lxc-jellyfin.tf - without it the library
          would be rebuilt on the container's own disk and lost on the next
          rebuild.
        quiet: true
      loop: "{{ jellyfin_mounts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Ensure the config and data directories belong to jellyfin
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: jellyfin
        group: jellyfin
        mode: "0750"
      loop:
        - "{{ jellyfin_config_dir }}"
        - "{{ jellyfin_data_dir }}"

    # Rebuildable and write-heavy, so deliberately on the container's own
    # disk rather than the spinning pool.
    - name: Ensure the cache and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: jellyfin
        group: jellyfin
        mode: "0750"
      loop:
        - "{{ jellyfin_cache_dir }}"
        - "{{ jellyfin_log_dir }}"

    # --- Configuration ---

    - name: Render /etc/default/jellyfin
      ansible.builtin.template:
        src: jellyfin/jellyfin.default.j2
        dest: /etc/default/jellyfin
        owner: root
        group: root
        mode: "0644"
      notify: Restart jellyfin

    - name: Create the systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jellyfin.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Without this jellyfin writes 0644 files and 0755 directories, so the
    # artwork and trickplay data it generates alongside the media is not
    # writable by the jellyfin_srv group - meaning samba users can't manage
    # or delete it. Samba already force-creates 0664/2775 into that group;
    # this makes jellyfin symmetrical with it.
    - name: Make jellyfin create group-writable files
      ansible.builtin.template:
        src: jellyfin/umask.conf.j2
        dest: /etc/systemd/system/jellyfin.service.d/umask.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart jellyfin

    # --- Service ---

    - name: Apply pending restarts before verifying
      ansible.builtin.meta: flush_handlers

    - name: Ensure jellyfin is enabled and running
      ansible.builtin.systemd:
        name: jellyfin
        state: started
        enabled: true

    # --- Verification ---

    # runuser rather than sudo: it's part of util-linux and always present,
    # whereas sudo may not be installed in a minimal container. This proves
    # the access as the service account itself rather than inferring it
    # from group membership.
    - name: Check jellyfin can reach the GPU and its storage
      ansible.builtin.command:
        argv: [runuser, -u, jellyfin, --, test, -w, "{{ item }}"]
      changed_when: false
      loop:
        - /dev/dri/renderD128
        - /dev/dri/card0
        - "{{ jellyfin_data_dir }}"
        - "{{ jellyfin_config_dir }}"
        - "{{ jellyfin_media_dir }}"
      loop_control:
        label: "{{ item }}"

    - name: Wait for jellyfin to answer on its port
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/health"
        status_code: [200]
      register: jellyfin_health
      retries: 12
      delay: 5
      until: jellyfin_health.status == 200

    - name: Report
      ansible.builtin.debug:
        msg: >-
          jellyfin is up on port {{ jellyfin_port }}, running as
          uid {{ jellyfin_uid }} with GPU and media access, data in
          {{ jellyfin_data_dir }}.

  handlers:

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart jellyfin
      ansible.builtin.systemd:
        name: jellyfin
        state: restarted
