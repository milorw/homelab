- name: Configure edge router (Caddy + CoreDNS)
  hosts: edge_router
  gather_facts: true
  # Handlers run at the end of a play, so a failure partway through would
  # otherwise leave a rendered config file on disk that never gets loaded
  force_handlers: true

  vars:
    edge_root: /opt/edge
    edge_config_dir: "{{ edge_root }}/config"
    edge_data_dir: "{{ edge_root }}/data"
    edge_caddy_state_dir: "{{ edge_root }}/caddy-state"
    edge_errors_dir: "{{ edge_config_dir }}/errors"
    # Where that same directory lands inside the caddy container, since
    # config/ is mounted at /etc/caddy - this is what the Caddyfile refers to
    edge_errors_container_dir: /etc/caddy/errors

  tasks:
    - name: Set up Docker
      ansible.builtin.include_tasks: tasks/docker.yml

    - name: Ensure tailscale is installed
      ansible.builtin.apt:
        name: tailscale
        state: present

    - name: Ensure tailscaled is running
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    - name: Read tailscale status
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_raw
      changed_when: false
      failed_when: false # tailscale exits 1 when not connected

    - name: Parse tailscale status
      ansible.builtin.set_fact:
        tailscale_status: "{{ tailscale_status_raw.stdout | from_json }}"

    - name: Fail if tailscale needs manual intervention
      ansible.builtin.fail:
        msg: >-
          tailscale on {{ inventory_hostname }} is not connected
          (BackendState={{ tailscale_status.BackendState }}).
          {{ ('Auth needed: ' ~ tailscale_status.AuthURL) if tailscale_status.AuthURL
             else 'Run `tailscale up` on the host to diagnose and reconnect.' }}
      when: tailscale_status.BackendState != 'Running'

    - name: Set tailscale IP fact
      ansible.builtin.set_fact:
        edge_tailscale_ip: "{{ tailscale_status.TailscaleIPs | select('match', '^[0-9]+\\.') | first }}"

    # --- Subnet router -----------------------------------------------------
    #
    # These were hand-set on the container and invisible to this repo, which
    # meant nothing recorded that the edge routes the whole LAN for the
    # tailnet - or that it rewrote the source address while doing it.
    #
    # snat_subnet_routes: false is the important half. With SNAT on, remote
    # traffic reaches the LAN wearing the edge's own address, so every guest
    # sees it as edge_router and the firewall can't tell a tailnet user from
    # the reverse proxy. Off, the real 100.x source survives and the ts_net
    # rules mean what they say.
    #
    # It requires a return route: without SNAT the guests answer 100.x, and
    # their default gateway has no idea where that is. See
    # docs/Ansible/edge-router.md.

    # Derived from inventory, so an empty or broken lookup would silently
    # advertise nothing and take remote SSH and SMB down with it.
    - name: Check the advertised route list resolved
      ansible.builtin.assert:
        that:
          - edge_tailscale_advertise_routes | length > 0
          - edge_tailscale_advertise_routes | select('search', '/32$') | list | length
            == edge_tailscale_advertise_routes | length
        fail_msg: >-
          edge_tailscale_advertise_routes resolved to
          {{ edge_tailscale_advertise_routes }}, which is empty or malformed.
          It is built from the proxmox_all_lxc inventory group - check the
          dynamic inventory is returning containers.
        quiet: true

    - name: Read tailscale prefs
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_prefs_raw
      changed_when: false

    - name: Parse tailscale prefs
      ansible.builtin.set_fact:
        tailscale_prefs: "{{ tailscale_prefs_raw.stdout | from_json }}"

    # tailscale set is idempotent, but running it unconditionally would
    # report changed every time, so compare first. NoSNAT is the inverse of
    # the --snat-subnet-routes flag.
    - name: Apply subnet router prefs
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - "--advertise-routes={{ edge_tailscale_advertise_routes | join(',') }}"
          - "--snat-subnet-routes={{ edge_tailscale_snat_subnet_routes | bool | ternary('true', 'false') }}"
      when: >-
        (tailscale_prefs.AdvertiseRoutes | default([]) | sort)
          != (edge_tailscale_advertise_routes | sort)
        or (tailscale_prefs.NoSNAT | default(false))
             != (not (edge_tailscale_snat_subnet_routes | bool))
      changed_when: true

    - name: Confirm the prefs took
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_prefs_after
      changed_when: false

    - name: Fail if the subnet router prefs did not apply
      ansible.builtin.assert:
        that:
          - (after.AdvertiseRoutes | default([]) | sort) == (edge_tailscale_advertise_routes | sort)
          - (after.NoSNAT | default(false)) == (not (edge_tailscale_snat_subnet_routes | bool))
        fail_msg: >-
          tailscale prefs did not apply. Wanted routes
          {{ edge_tailscale_advertise_routes }} with NoSNAT
          {{ not (edge_tailscale_snat_subnet_routes | bool) }}; got
          {{ after.AdvertiseRoutes | default([]) }} / {{ after.NoSNAT | default(false) }}.
          A newly advertised route also has to be approved in the tailnet
          admin console before it carries traffic.
        quiet: true
      vars:
        after: "{{ tailscale_prefs_after.stdout | from_json }}"

    - name: Create config/data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        # config is 0755 because it's mounted as a directory, so processes inside
        # the containers have to traverse it - and the haproxy image runs as a
        # non-root user. Nothing secret lives here; the Cloudflare tokens are in
        # {{ edge_root }}/.env (0600).
        - { path: "{{ edge_config_dir }}", mode: "0755" }
        - { path: "{{ edge_errors_dir }}", mode: "0755" }
        # data holds Caddy's certificate private keys - keep it tight
        - { path: "{{ edge_data_dir }}", mode: "0750" }
        - { path: "{{ edge_caddy_state_dir }}", mode: "0750" }
        - { path: "{{ edge_root }}/caddy", mode: "0755" }
      loop_control:
        label: "{{ item.path }}"

    - name: Render Corefile
      ansible.builtin.template:
        src: edge_router/Corefile.j2
        dest: "{{ edge_config_dir }}/Corefile"
        mode: "0644"
      notify: Restart coredns

    - name: Render Caddyfile
      ansible.builtin.template:
        src: edge_router/Caddyfile.j2
        dest: "{{ edge_config_dir }}/Caddyfile"
        mode: "0644"
      # No notify - the unconditional reload after the stack comes up covers
      # this, so a config that gets rendered but never loaded can't happen.

    # No notify: Caddy reads these off disk per request, so a changed page is
    # live immediately - there's no loaded copy to invalidate.
    - name: Render error pages
      ansible.builtin.template:
        src: edge_router/error.html.j2
        dest: "{{ edge_errors_dir }}/{{ item }}.html"
        mode: "0644"
      loop:
        # unreachable - Caddy couldn't reach the backend at all
        # starting    - backend answered 502/503/504 itself, i.e. it's up but
        #               not serving yet (usually waiting on its database)
        - unreachable
        - starting
      vars:
        edge_error_mode: "{{ item }}"

    - name: Render haproxy.cfg
      ansible.builtin.template:
        src: edge_router/haproxy.cfg.j2
        dest: "{{ edge_config_dir }}/haproxy.cfg"
        mode: "0644"
      notify: Restart haproxy

    - name: Deploy compose project file
      ansible.builtin.copy:
        src: edge/compose.yaml
        dest: "{{ edge_root }}/compose.yaml"
        mode: "0644"

    - name: Deploy caddy build context
      ansible.builtin.copy:
        src: edge/caddy/Dockerfile
        dest: "{{ edge_root }}/caddy/Dockerfile"
        mode: "0644"

    - name: Render .env with Cloudflare tokens
      ansible.builtin.template:
        src: edge_router/edge.env.j2
        dest: "{{ edge_root }}/.env"
        mode: "0600"
      no_log: true
      notify: Recreate stack

    - name: Bring up the stack
      community.docker.docker_compose_v2:
        project_src: "{{ edge_root }}"
        state: present

    # Convergence rather than a change: `caddy reload` is a no-op when the
    # running config already matches ("config is unchanged" in the log).
    # Safe to run unconditionally now that config is a directory mount - the
    # container genuinely sees the current file, so this can't push a stale
    # view back. It also means a Caddyfile rendered by a run that died
    # before its handler can't stay unloaded forever.
    # -T because there's no TTY under Ansible.
    - name: Ensure Caddy has loaded the current Caddyfile
      ansible.builtin.command: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
      args:
        chdir: "{{ edge_root }}"
      changed_when: false
      # `docker compose up` returns once containers are started, which is a
      # moment before Caddy's admin API is actually listening - and any run
      # that changes the compose file recreates them, so this races.
      register: caddy_reload
      until: caddy_reload.rc == 0
      retries: 5
      delay: 3

  handlers:
    # changed_when: true - these only ever run because a config file changed,
    # and restarting a container is a real state change. Ansible can't infer
    # that from a bare command, hence declaring it.
    - name: Restart coredns
      ansible.builtin.command: docker compose restart coredns
      args:
        chdir: "{{ edge_root }}"
      changed_when: true

    - name: Restart haproxy
      ansible.builtin.command: docker compose restart haproxy
      args:
        chdir: "{{ edge_root }}"
      changed_when: true

    # Env vars are only read when a container is created, so a .env change
    # genuinely needs a recreate - a restart won't pick it up.
    - name: Recreate stack
      community.docker.docker_compose_v2:
        project_src: "{{ edge_root }}"
        state: present
        recreate: always
