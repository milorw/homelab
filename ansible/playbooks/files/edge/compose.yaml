services:
  coredns:
    image: coredns/coredns:1.11.1
    container_name: coredns
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/etc/coredns:ro
    command: -conf /etc/coredns/Corefile

  caddy:
    build:
      context: ./caddy
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      # /etc/caddy/Caddyfile is the image's default config path
      - ./config:/etc/caddy:ro
      - ./data:/data
      # Caddy's own writable state (autosave.json) - kept separate from the
      # read-only rendered config, which it used to share a directory with
      - ./caddy-state:/config

  haproxy:
    image: haproxy:lts
    container_name: haproxy
    restart: unless-stopped
    network_mode: host
    volumes:
      # /usr/local/etc/haproxy/haproxy.cfg is the image's default config path
      - ./config:/usr/local/etc/haproxy:ro
