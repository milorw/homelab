# Vars for the jellyfin group (LXC 106) - see docs/Ansible/jellyfin.md.
# The container is privileged with no idmap, so every uid and gid here is
# the same number on the Proxmox host.

# --- Identity ---
# Pinned to the ids that already own /tank/appdata/jellyfin_data.
jellyfin_uid: 107
jellyfin_gid: 110

# video/jellyfin_render: the GPU device nodes. jellyfin_srv: owns the media
# on /tank/jellyfin, shared with samba (group_vars/samba.yml).
jellyfin_groups:
  - { name: video, gid: 44 }
  - { name: jellyfin_render, gid: 1061 }
  - { name: jellyfin_srv, gid: 1060 }

# --- Storage ---
# Jellyfin's own default paths, with /tank/appdata bind-mounted onto them
# (terraform/lxc-jellyfin.tf). Don't move them: Jellyfin stores absolute
# paths in its database.
jellyfin_config_dir: /etc/jellyfin
jellyfin_data_dir: /var/lib/jellyfin

# Rebuildable and write-heavy, so on the container's disk, not /tank.
jellyfin_cache_dir: /var/cache/jellyfin
jellyfin_log_dir: /var/log/jellyfin

# Don't move this either: every library path in the database is absolute.
jellyfin_media_dir: /opt/jellyfin

# --- Package ---
jellyfin_repo_url: https://repo.jellyfin.org/debian
jellyfin_repo_key_url: https://repo.jellyfin.org/jellyfin_team.gpg.key
jellyfin_repo_keyring: /etc/apt/keyrings/jellyfin.asc
